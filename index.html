<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JS テトリス (スマホ対応)</title>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E7N6LZX515"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-E7N6LZX515');
</script>

  <style>
    * {
      touch-action: manipulation; /* スマホでのダブルタップ拡大防止 */
      user-select: none;          /* 長押しでのテキスト選択防止 */
      -webkit-user-select: none;
    }
    body {
      background: #202028;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 10px;
      overflow: hidden; /* 画面の不要なスクロールを防ぐ */
    }
    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
    canvas {
      border: solid 2px #fff;
      background-color: #000;
      max-width: 90vw;
      max-height: 70vh;
      width: auto;
      height: auto;
      touch-action: none; /* スマホでのスワイプによるスクロール防止 */
    }
    #instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <div id="score">SCORE: 0</div>
  <canvas id="tetris" width="240" height="400"></canvas>
  <div id="instructions">
    【タップ操作】<br>
    ブロック上: 回転 | 左側: 左移動 | 右側: 右移動<br>
    【PCキーボード】<br>
    ←/→: 移動 | ↑: 回転 | ↓: 落下 | スペース: ハードドロップ
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20); // 1ブロックを20pxとして計算 (12x20列)

    // テトリミノ（ブロック）の形状定義
    const PIECES = 'TJLOSZI';
    const COLORS = [
      null,
      '#FF0D72', '#0DC2FF', '#0DFF72',
      '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
    ];

    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    // 12x20のステージ（フィールド）を作成
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
    };

    // 衝突判定
    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 固定されたブロックとプレイヤーブロックを描画
    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 固定処理
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // ライン消去判定
    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
      }
      updateScore();
    }

    // 通常落下処理
    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    // ハードドロップ処理
    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    // 移動処理
    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // 回転処理
    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    // 新しいブロックの生成 & ゲームオーバー判定
    function playerReset() {
      player.matrix = createPiece(PIECES[PIECES.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function updateScore() {
      document.getElementById('score').innerText = 'SCORE: ' + player.score;
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    // ゲームループ
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // 画面タップ・クリックの判定処理
    function handlePointer(event) {
      event.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const clientY = event.touches ? event.touches[0].clientY : event.clientY;

      // キャンバス上の座標を取得 (0 〜 12 / 0 〜 20)
      const touchX = (clientX - rect.left) / rect.width * 12;
      const touchY = (clientY - rect.top) / rect.height * 20;

      // 現在のブロックの範囲（左端と右端の列）を特定
      const matrix = player.matrix;
      let minX = matrix[0].length;
      let maxX = -1;

      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < matrix[y].length; ++x) {
          if (matrix[y][x] !== 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
      }

      const pieceLeft = player.pos.x + minX;
      const pieceRight = player.pos.x + maxX + 1;

      // タップ位置に応じた操作
      if (touchX >= pieceLeft && touchX <= pieceRight) {
        // ブロック上をタップ: 回転
        playerRotate(1);
      } else if (touchX < pieceLeft) {
        // ブロックより左側をタップ: 左移動
        playerMove(-1);
      } else if (touchX > pieceRight) {
        // ブロックより右側をタップ: 右移動
        playerMove(1);
      }
    }

    // タッチおよびマウスクリックのイベントを登録
    canvas.addEventListener('touchstart', handlePointer, { passive: false });
    canvas.addEventListener('mousedown', handlePointer);

    // PCキーボード操作設定
    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) {        // 左キー
        playerMove(-1);
      } else if (event.keyCode === 39) { // 右キー
        playerMove(1);
      } else if (event.keyCode === 40) { // 下キー
        playerDrop();
      } else if (event.keyCode === 38) { // 上キー
        playerRotate(1);
      } else if (event.keyCode === 32) { // スペースキー
        event.preventDefault();
        playerHardDrop();
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
