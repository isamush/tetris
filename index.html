<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JS テトリス (音・スマホ対応)</title>
  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #202028;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 10px;
      overflow: hidden;
    }
    /* 音声トグルスイッチのスタイル */
    .sound-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0DC2FF;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }
    canvas {
      border: solid 2px #fff;
      background-color: #000;
      max-width: 90vw;
      max-height: 65vh;
      width: auto;
      height: auto;
      touch-action: none;
    }
    #instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <!-- 音声トグルスイッチ -->
  <div class="sound-control">
    <span>SOUND</span>
    <label class="switch">
      <input type="checkbox" id="soundToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div id="score">SCORE: 0</div>
  <canvas id="tetris" width="240" height="400"></canvas>
  <div id="instructions">
    【タップ操作】<br>
    ブロック上: 回転 | 左側: 左移動 | 右側: 右移動<br>
    【PCキーボード】<br>
    ←/→: 移動 | ↑: 回転 | ↓: 落下 | スペース: ハードドロップ
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    // Web Audio API の初期化
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ブロック消去時の効果音再生（ファミコン風ピコピコ音）
    function playClearSound() {
      const soundToggle = document.getElementById('soundToggle');
      if (!soundToggle.checked) return; // スイッチがOFFなら鳴らさない

      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square'; // 矩形波（レトロゲーム風の音）
      
      // 高音の短いサウンド (880Hz -> 1760Hz)
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);

      // フェードアウト処理
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    // テトリミノの形状定義
    const PIECES = 'TJLOSZI';
    const COLORS = [
      null,
      '#FF0D72', '#0DC2FF', '#0DFF72',
      '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'
    ];

    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
    };

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // ライン消去判定
    function arenaSweep() {
      let rowCount = 1;
      let cleared = false;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
        cleared = true;
      }

      // ラインが1個以上消えたら効果音を鳴らす
      if (cleared) {
        playClearSound();
      }

      updateScore();
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerReset() {
      player.matrix = createPiece(PIECES[PIECES.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
      }
    }

    function updateScore() {
      document.getElementById('score').innerText = 'SCORE: ' + player.score;
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // タップ・クリック操作
    function handlePointer(event) {
      event.preventDefault();
      initAudio(); // ユーザー操作イベント内で音声無効化を解除

      const rect = canvas.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;
      const clientY = event.touches ? event.touches[0].clientY : event.clientY;

      const touchX = (clientX - rect.left) / rect.width * 12;

      const matrix = player.matrix;
      let minX = matrix[0].length;
      let maxX = -1;

      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < matrix[y].length; ++x) {
          if (matrix[y][x] !== 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
      }

      const pieceLeft = player.pos.x + minX;
      const pieceRight = player.pos.x + maxX + 1;

      if (touchX >= pieceLeft && touchX <= pieceRight) {
        playerRotate(1);
      } else if (touchX < pieceLeft) {
        playerMove(-1);
      } else if (touchX > pieceRight) {
        playerMove(1);
      }
    }

    canvas.addEventListener('touchstart', handlePointer, { passive: false });
    canvas.addEventListener('mousedown', handlePointer);

    // キーボード操作
    document.addEventListener('keydown', event => {
      initAudio(); // キー入力でも音声コンテキストを初期化
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      } else if (event.keyCode === 32) {
        event.preventDefault();
        playerHardDrop();
      }
    });

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
