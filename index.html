<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gen AI Tetris </title>
  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #202028;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding-top: 10px;
      overflow: hidden;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .sound-control, .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0DC2FF;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    #score {
      font-size: 24px;
      font-weight: bold;
    }
    #level {
      font-size: 16px;
      color: #0DC2FF;
      margin-top: 4px;
      margin-bottom: 10px;
    }
    canvas {
      border: solid 2px #fff;
      background-color: #000;
      max-width: 90vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      touch-action: none;
    }
    #instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <!-- 設定トグルスイッチ群 -->
  <div class="controls">
    <div class="sound-control">
      <span>SOUND</span>
      <label class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="speed-control">
      <span>SPEED</span>
      <label class="switch">
        <input type="checkbox" id="speedToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="score">SCORE: 0</div>
  <div id="level">LEVEL: 1 (NORMAL)</div>
  <canvas id="tetris" width="240" height="400"></canvas>
  <div id="instructions">
    【タップ操作】<br>
    ブロック上: 回転 | 左側: 左移動 | 右側: 右移動<br>
    【PCキーボード】<br>
    ←/→: 移動 | ↑: 回転 | ↓: 落下 | スペース: ハードドロップ
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playClearSound() {
      const soundToggle = document.getElementById('soundToggle');
      if (!soundToggle.checked) return;

      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.12);
    }

    const PIECES = 'TJLOSZI';
    const COLORS = [
      null,
      '#FF0D72', '#0DC2FF', '#0DFF72',
      '#F538FF', '#FF8E0D', '#FFE138', '#3877FF',
      '#FFFFFF' // 8: 発光用
    ];

    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    const arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
      level: 1,
    };

    let isAnimating = false;

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      if (player.matrix) {
        drawMatrix(player.matrix, player.pos);
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = COLORS[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      const fullRows = [];
      for (let y = arena.length - 1; y >= 0; --y) {
        let isFull = true;
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            isFull = false;
            break;
          }
        }
        if (isFull) {
          fullRows.push(y);
        }
      }

      if (fullRows.length === 0) {
        playerReset();
        return;
      }

      isAnimating = true;
      fullRows.forEach(y => {
        arena[y].fill(8);
      });
      playClearSound();

      setTimeout(() => {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y >= 0; --y) {
          for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) {
              continue outer;
            }
          }
          const row = arena.splice(y, 1)[0].fill(0);
          arena.unshift(row);
          ++y;

          player.score += rowCount * 10;
          rowCount *= 2;
        }

        updateStats();
        isAnimating = false;
        playerReset();
      }, 150);
    }

    function playerDrop() {
      if (isAnimating) return;
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        player.matrix = null;
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      if (isAnimating) return;
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      player.matrix = null;
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (isAnimating || !player.matrix) return;
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function playerRotate(dir) {
      if (isAnimating || !player.matrix) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerReset() {
      player.matrix = createPiece(PIECES[PIECES.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateStats();
      }
    }

    // スコア・レベル・スピード間隔の更新
    function updateStats() {
      const speedToggle = document.getElementById('speedToggle');
      
      if (speedToggle.checked) {
        // 50点ごとに1レベル上昇 (最大レベル10)
        player.level = Math.min(10, Math.floor(player.score / 50) + 1);
        // レベル1: 1000ms 〜 レベル10: 100ms（段階的に100msずつ短縮）
        dropInterval = 1000 - (player.level - 1) * 100;
        document.getElementById('level').innerText = 'LEVEL: ' + player.level;
      } else {
        player.level = 1;
        dropInterval = 1000; // NORMALスピード
        document.getElementById('level').innerText = 'LEVEL: 1 (NORMAL)';
      }

      document.getElementById('score').innerText = 'SCORE: ' + player.score;
    }

    // スピード切り替えスイッチの変更イベントリスナー
    document.getElementById('speedToggle').addEventListener('change', () => {
      updateStats();
    });

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function handlePointer(event) {
      event.preventDefault();
      initAudio();
      if (isAnimating || !player.matrix) return;

      const rect = canvas.getBoundingClientRect();
      const clientX = event.touches ? event.touches[0].clientX : event.clientX;

      const touchX = (clientX - rect.left) / rect.width * 12;

      const matrix = player.matrix;
      let minX = matrix[0].length;
      let maxX = -1;

      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < matrix[y].length; ++x) {
          if (matrix[y][x] !== 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
      }

      const pieceLeft = player.pos.x + minX;
      const pieceRight = player.pos.x + maxX + 1;

      if (touchX >= pieceLeft && touchX <= pieceRight) {
        playerRotate(1);
      } else if (touchX < pieceLeft) {
        playerMove(-1);
      } else if (touchX > pieceRight) {
        playerMove(1);
      }
    }

    canvas.addEventListener('touchstart', handlePointer, { passive: false });
    canvas.addEventListener('mousedown', handlePointer);

    document.addEventListener('keydown', event => {
      initAudio();
      if (isAnimating) return;
      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      } else if (event.keyCode === 32) {
        event.preventDefault();
        playerHardDrop();
      }
    });

    playerReset();
    updateStats();
    update();
  </script>
</body>
</html>
